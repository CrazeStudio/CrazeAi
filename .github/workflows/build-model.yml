name: Build CrazeAI Model

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-model.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell /usr/local/lib/node_modules /usr/share/dotnet
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential python3 python3-pip python3-venv

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF
          cmake --build llama.cpp/build --config Release -j2 --target llama-quantize

      - name: Install converter dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r llama.cpp/requirements.txt huggingface_hub

      - name: Download Qwen3-1.7B
        run: |
          . .venv/bin/activate
          hf download Qwen/Qwen3-1.7B --local-dir qwen3

      - name: Create CrazeAI behavior profile
        run: |
          cat > crazeai-system.txt <<'EOF'
          You are CrazeAI, an AI assistant created by CrazeStudio and based on Qwen3-1.7B.

          IDENTITY
          Your assistant name is CrazeAI. Your underlying pretrained base model is Qwen3-1.7B. Never falsely claim that CrazeStudio created or trained Qwen3 from scratch.

          ACCURACY RULES
          1. Answer the user's actual question directly.
          2. Prefer factual accuracy over fluent-sounding guesses.
          3. Never invent dates, names, quotations, books, events, statistics, citations, or sources.
          4. If you are not confident about a factual detail, explicitly say you are uncertain.
          5. For historical people and events, do not fill missing facts from imagination.
          6. Distinguish known facts from interpretation or speculation.
          7. Do not repeat a user's claim as fact unless you have enough confidence in it.
          8. For current information, say that your built-in knowledge may be outdated.
          9. Keep answers concise unless the user asks for detail.

          CAPABILITIES
          You can help with general questions, programming, mathematics, science, history, writing, learning, and problem solving.

          SELF-DESCRIPTION
          If asked who you are, say: "I'm CrazeAI, an AI assistant created by CrazeStudio and based on Qwen3-1.7B."
          EOF

          cat > verified-knowledge.json <<'EOF'
          {
            "purpose": "Small verified seed facts for CrazeAI applications. Treat these as examples, not a complete knowledge base.",
            "facts": [
              {
                "topic": "Raja Ram Mohan Roy",
                "answer": "Raja Ram Mohan Roy was born in 1772 at Radhanagar in Bengal. He was a major Indian social and religious reformer. He campaigned against sati, supported modern education and religious reform, and founded the Brahmo Sabha in 1828, which later became associated with the Brahmo Samaj. He died in Bristol, England, in 1833."
              },
              {
                "topic": "HTML",
                "answer": "HTML stands for HyperText Markup Language. It is the standard markup language used to structure content on web pages."
              },
              {
                "topic": "Python",
                "answer": "Python is a high-level general-purpose programming language known for readable syntax and a large ecosystem of libraries."
              }
            ]
          }
          EOF

      - name: Convert to GGUF
        run: |
          . .venv/bin/activate
          python llama.cpp/convert_hf_to_gguf.py qwen3 --outfile qwen3-f16.gguf --outtype f16

      - name: Quantize CrazeAI
        run: |
          mkdir -p release
          llama.cpp/build/bin/llama-quantize qwen3-f16.gguf release/crazeai-qwen3-1.7b-q4_k_m.gguf Q4_K_M
          cp crazeai-system.txt release/crazeai-system.txt
          cp verified-knowledge.json release/verified-knowledge.json
          ls -lh release/

      - name: Upload CrazeAI model
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-qwen3-1.7b-q4_k_m
          path: release/
          retention-days: 30
