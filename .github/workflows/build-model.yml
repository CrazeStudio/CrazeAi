name: Build CrazeAI Model

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-model.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell /usr/share/dotnet
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential python3 python3-pip python3-venv

      - name: Build optimized llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF
          cmake --build llama.cpp/build --config Release -j2 --target llama-quantize llama-cli

      - name: Install converter dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r llama.cpp/requirements.txt huggingface_hub

      - name: Download Qwen3-1.7B base model
        run: |
          . .venv/bin/activate
          hf download Qwen/Qwen3-1.7B --local-dir qwen3

      - name: Convert Qwen3 to GGUF
        run: |
          . .venv/bin/activate
          python llama.cpp/convert_hf_to_gguf.py qwen3 --outfile qwen3-f16.gguf --outtype f16

      - name: Quantize lightweight CrazeAI
        run: |
          mkdir -p release
          llama.cpp/build/bin/llama-quantize qwen3-f16.gguf release/crazeai-qwen3-1.7b-q4_k_m.gguf Q4_K_M
          ls -lh release/crazeai-qwen3-1.7b-q4_k_m.gguf

      - name: Verify CrazeAI identity, knowledge and chat
        run: |
          llama.cpp/build/bin/llama-cli \
            -m release/crazeai-qwen3-1.7b-q4_k_m.gguf \
            --jinja \
            -sys 'You are CrazeAI, a lightweight conversational AI assistant created and packaged by CrazeStudio. Identity: your name is CrazeAI. Base model: Qwen3-1.7B. Be transparent that Qwen3-1.7B is your underlying pretrained model; do not claim that Qwen3 is CrazeAI or that you were independently trained from scratch. You are optimized for useful, concise conversation on limited hardware. You can answer general questions, explain concepts, reason about problems, write and debug code, and help users learn. When asked about yourself, state your name, base model, creator/package identity, and capabilities. Do not invent tools, browsing, memory, training, or capabilities that are not actually provided. Give direct answers instead of filler. For coding, provide complete practical snippets and explain important placement or usage details.' \
            -p 'Who are you? What are you based on? Who made you? What can you do?' \
            -n 160 \
            --temp 0.65 \
            --top-p 0.9 \
            --top-k 40 \
            --repeat-penalty 1.08 \
            --no-display-prompt

      - name: Upload CrazeAI model
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-qwen3-1.7b-q4_k_m
          path: release/crazeai-qwen3-1.7b-q4_k_m.gguf
          retention-days: 30
