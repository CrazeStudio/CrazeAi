name: Build CrazeAI Model

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-model.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell /usr/share/dotnet
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential python3 python3-pip python3-venv

      - name: Build llama.cpp conversion tools
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build llama.cpp/build --config Release -j2 --target llama-quantize llama-cli

      - name: Install converter dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r llama.cpp/requirements.txt
          pip install huggingface_hub

      - name: Download Qwen3-1.7B template model
        run: |
          . .venv/bin/activate
          hf download Qwen/Qwen3-1.7B --local-dir qwen3

      - name: Convert using Qwen3 architecture and tokenizer
        run: |
          . .venv/bin/activate
          python llama.cpp/convert_hf_to_gguf.py qwen3 --outfile qwen3-f16.gguf --outtype f16

      - name: Create lightweight CrazeAI model
        run: |
          mkdir -p release
          llama.cpp/build/bin/llama-quantize qwen3-f16.gguf release/crazeai-qwen3-1.7b-q4_k_m.gguf Q4_K_M
          ls -lh release/crazeai-qwen3-1.7b-q4_k_m.gguf

      - name: Verify real chat generation
        run: |
          llama.cpp/build/bin/llama-cli \
            -m release/crazeai-qwen3-1.7b-q4_k_m.gguf \
            --jinja \
            -sys 'You are CrazeAI, a helpful and concise AI assistant.' \
            -p 'Hello. What is HTML?' \
            -n 64 \
            --no-display-prompt

      - name: Upload CrazeAI model
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-qwen3-1.7b-q4_k_m
          path: release/crazeai-qwen3-1.7b-q4_k_m.gguf
          retention-days: 30
