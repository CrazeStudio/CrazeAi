name: CrazeAI Scratch Pretraining
on:
  workflow_dispatch:
    inputs:
      documents:
        description: Number of public corpus documents to stream
        type: number
        default: 100000
        required: true
      steps:
        description: Optimizer steps (increase for longer training)
        type: number
        default: 10000
        required: true
      batch_size:
        description: Per-device batch size
        type: number
        default: 8
        required: true
permissions:
  contents: read
concurrency:
  group: crazeai-scratch-pretraining
  cancel-in-progress: false
jobs:
  pretrain:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 7200
    env:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify CUDA
        run: |
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__, "CUDA:", torch.version.cuda)
          if not torch.cuda.is_available():
              raise SystemExit("Scratch pretraining requires a CUDA-enabled GPU runner.")
          print("GPU:", torch.cuda.get_device_name(0))
          PY
      - name: Stream public training corpus
        run: python scripts/collect_corpus.py --limit "${{ inputs.documents }}"
      - name: Train CrazeAI tokenizer
        run: python scripts/train_tokenizer.py --vocab-size 16000
      - name: Pretrain randomly initialized CrazeAI
        run: |
          python scripts/pretrain.py \
            --steps "${{ inputs.steps }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --resume
      - name: Upload model, corpus manifest and training state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-scratch-run-${{ github.run_id }}
          path: |
            outputs/crazeai-base/
            data/corpus/raw.manifest.json
          if-no-files-found: ignore
          retention-days: 30
