name: Build CrazeAI 135M -> GGUF Q4 (100 MB target)

on:
  workflow_dispatch:
    inputs:
      max_examples:
        description: "CPU-friendly starting size; increase for longer training runs"
        type: number
        required: false
        default: 1000
      epochs:
        description: "Training epochs"
        type: number
        required: false
        default: 1
      seq_len:
        description: "Packed sequence length"
        type: number
        required: false
        default: 128
      batch_size:
        description: "JAX batch size (keep at 1 on standard CPU runners)"
        type: number
        required: false
        default: 1
      chunk_size:
        description: "Training steps compiled into one JAX dispatch"
        type: number
        required: false
        default: 1
      max_model_size_mb:
        description: "Fail if the final GGUF exceeds this size in decimal MB"
        type: number
        required: false
        default: 100

permissions:
  contents: read

concurrency:
  group: crazeai-training-${{ github.ref }}
  cancel-in-progress: false

env:
  # Standard GitHub-hosted runners are CPU-only and memory constrained.
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: "false"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  XLA_FLAGS: "--xla_cpu_multi_thread_eigen=true intra_op_parallelism_threads=2"

jobs:
  train-and-quantize:
    runs-on: ubuntu-24.04
    # GitHub-hosted jobs have a 6-hour maximum timeout.
    timeout-minutes: 360

    steps:
      - name: Checkout CrazeAI
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training_jax/requirements.txt

      - name: Install training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training_jax/requirements.txt

      - name: Verify JAX CPU backend and Python syntax
        run: |
          python - <<'PY'
          import os
          import jax
          print("JAX:", jax.__version__)
          print("Backend:", jax.default_backend())
          print("Devices:", jax.devices())
          print("CPU threads:", os.environ.get("OMP_NUM_THREADS"))
          assert jax.default_backend() == "cpu", "Workflow expected the CPU backend"
          PY
          python -m compileall -q training_jax training_v2

      - name: Prepare SFT data
        run: |
          mkdir -p artifacts
          python training_v2/prepare_sft.py \
            --max-examples "${{ inputs.max_examples || 1000 }}" \
            --output artifacts/sft.jsonl
          test -s artifacts/sft.jsonl
          wc -l artifacts/sft.jsonl

      - name: Train CrazeAI with JAX
        run: |
          python training_jax/train.py \
            --data artifacts/sft.jsonl \
            --output artifacts/crazeai-jax \
            --epochs "${{ inputs.epochs || 1 }}" \
            --seq-len "${{ inputs.seq_len || 128 }}" \
            --batch-size "${{ inputs.batch_size || 1 }}" \
            --max-examples "${{ inputs.max_examples || 1000 }}" \
            --chunk-size "${{ inputs.chunk_size || 1 }}"

      - name: Export and validate Hugging Face checkpoint
        run: |
          python training_jax/export_hf.py \
            --checkpoint artifacts/crazeai-jax \
            --output artifacts/crazeai-135m
          test -s artifacts/crazeai-135m/model.safetensors
          test -s artifacts/crazeai-135m/config.json

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF
          cmake --build llama.cpp/build --config Release \
            -j"$(nproc)" \
            --target llama-quantize llama-cli
          python -m pip install -r llama.cpp/requirements.txt

      - name: Convert to GGUF F16
        run: |
          python llama.cpp/convert_hf_to_gguf.py \
            artifacts/crazeai-135m \
            --outfile artifacts/crazeai-135m-f16.gguf \
            --outtype f16
          test -s artifacts/crazeai-135m-f16.gguf

      - name: Quantize Q4_K_M and enforce size target
        shell: bash
        run: |
          set -euo pipefail
          model="artifacts/crazeai-135m-q4_k_m.gguf"
          llama.cpp/build/bin/llama-quantize \
            artifacts/crazeai-135m-f16.gguf \
            "$model" \
            Q4_K_M
          test -s "$model"

          size_bytes="$(stat -c '%s' "$model")"
          limit_bytes="$(( ${{ inputs.max_model_size_mib || 100 }} * 1024 * 1024 ))"
          size_mb="$(awk -v b="$size_bytes" 'BEGIN { printf "%.2f", b / 1000000 }')"
          echo "Final GGUF size: ${size_mb} MB (${size_bytes} bytes)"
          echo "Configured limit: ${{ inputs.max_model_size_mib || 100 }} MiB"
          if (( size_bytes > limit_bytes )); then
            echo "::error::Quantized GGUF exceeds the configured size limit."
            exit 1
          fi

      - name: Smoke test GGUF
        run: |
          llama.cpp/build/bin/llama-cli \
            -m artifacts/crazeai-135m-q4_k_m.gguf \
            -p "Who are you?" \
            -n 48 \
            --temp 0.2 \
            --no-display-prompt | tee artifacts/smoke-test.txt
          test -s artifacts/smoke-test.txt

      - name: Upload compact CrazeAI GGUF
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-135m-q4-k-m-under-100-mb
          path: |
            artifacts/crazeai-135m-q4_k_m.gguf
            artifacts/smoke-test.txt
          if-no-files-found: error
          retention-days: 30
