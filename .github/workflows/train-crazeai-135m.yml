name: Build CrazeAI JAX 135M -> GGUF Q4

on:
  workflow_dispatch:
    inputs:
      max_examples:
        description: "Maximum SFT examples"
        required: false
        default: "150000"
      epochs:
        description: "Training epochs"
        required: false
        default: "1"
      seq_len:
        description: "Packed sequence length (256 is faster on CPU)"
        required: false
        default: "256"
      batch_size:
        description: "JAX batch size"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: crazeai-training
  cancel-in-progress: false

env:
  # GitHub-hosted runners are CPU-only. Explicitly select CPU so JAX does not
  # waste startup time probing incompatible CUDA/PJRT plugins.
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: "false"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  XLA_FLAGS: "--xla_cpu_multi_thread_eigen=true intra_op_parallelism_threads=4"

jobs:
  train-and-quantize:
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout CrazeAI
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            training_jax/requirements.txt

      - name: Install training stack
        run: |
          python -m pip install --upgrade pip
          pip install -r training_jax/requirements.txt

      - name: Verify JAX CPU backend
        run: |
          python - <<'PY'
          import os
          import jax
          print("JAX:", jax.__version__)
          print("Backend:", jax.default_backend())
          print("Devices:", jax.devices())
          print("CPU threads:", os.environ.get("OMP_NUM_THREADS"))
          PY
          python -m compileall training_jax

      - name: Prepare SFT data
        run: |
          mkdir -p artifacts
          python training_v2/prepare_sft.py \
            --max-examples "${{ inputs.max_examples || '150000' }}" \
            --output artifacts/sft.jsonl

      - name: Train CrazeAI with JAX
        run: |
          python training_jax/train.py \
            --data artifacts/sft.jsonl \
            --output artifacts/crazeai-jax \
            --epochs "${{ inputs.epochs || '1' }}" \
            --seq-len "${{ inputs.seq_len || '256' }}" \
            --batch-size "${{ inputs.batch_size || '8' }}"

      - name: Export Hugging Face checkpoint
        run: |
          python training_jax/export_hf.py \
            --checkpoint artifacts/crazeai-jax \
            --output artifacts/crazeai-135m

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF
          cmake --build llama.cpp/build --config Release \
            -j"$(nproc)" \
            --target llama-quantize llama-cli
          pip install -r llama.cpp/requirements.txt

      - name: Convert to GGUF F16
        run: |
          python llama.cpp/convert_hf_to_gguf.py \
            artifacts/crazeai-135m \
            --outfile artifacts/crazeai-135m-f16.gguf \
            --outtype f16

      - name: Quantize Q4_K_M
        run: |
          llama.cpp/build/bin/llama-quantize \
            artifacts/crazeai-135m-f16.gguf \
            artifacts/crazeai-135m-q4_k_m.gguf \
            Q4_K_M
          ls -lh artifacts/crazeai-135m-q4_k_m.gguf

      - name: Smoke test GGUF
        run: |
          llama.cpp/build/bin/llama-cli \
            -m artifacts/crazeai-135m-q4_k_m.gguf \
            -p "Who are you?" \
            -n 48 \
            --temp 0.2 \
            --no-display-prompt | tee artifacts/smoke-test.txt

      - name: Upload CrazeAI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-135m-jax-q4-k-m
          path: |
            artifacts/crazeai-135m-q4_k_m.gguf
            artifacts/crazeai-135m/config.json
            artifacts/crazeai-135m/model.safetensors
            artifacts/crazeai-135m/tokenizer.json
            artifacts/smoke-test.txt
          retention-days: 30
