name: Build CrazeAI JAX 135M -> GGUF Q4

on:
  push:
    branches: [main]
    paths:
      - "training_jax/**"
      - "training_v2/prepare_sft.py"
      - "training_v2/crazeai_identity.jsonl"
      - ".github/workflows/train-crazeai-135m.yml"
  workflow_dispatch:
    inputs:
      max_examples:
        description: "Maximum SFT examples"
        required: false
        default: "150000"
      epochs:
        description: "Training epochs"
        required: false
        default: "1"
      seq_len:
        description: "Packed sequence length"
        required: false
        default: "512"

permissions:
  contents: read

concurrency:
  group: crazeai-training
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir jax tokenizers
      - name: Syntax check
        run: python -m compileall training_jax

  train-and-quantize:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JAX training stack
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r training_jax/requirements.txt

      - name: Prepare high-quality SFT mixture
        run: |
          mkdir -p artifacts
          python training_v2/prepare_sft.py \
            --max-examples "${{ inputs.max_examples || '150000' }}" \
            --output artifacts/sft.jsonl

      - name: Train original CrazeAI transformer with JAX
        run: |
          python training_jax/train.py \
            --data artifacts/sft.jsonl \
            --output artifacts/crazeai-jax \
            --epochs "${{ inputs.epochs || '1' }}" \
            --seq-len "${{ inputs.seq_len || '512' }}"

      - name: Export JAX weights to Hugging Face format
        run: |
          python training_jax/export_hf.py \
            --checkpoint artifacts/crazeai-jax \
            --output artifacts/crazeai-135m

      - name: Build llama.cpp converter and quantizer
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF
          cmake --build llama.cpp/build --config Release -j2 --target llama-quantize llama-cli
          pip install -r llama.cpp/requirements.txt

      - name: Convert CrazeAI checkpoint to GGUF F16
        run: |
          python llama.cpp/convert_hf_to_gguf.py \
            artifacts/crazeai-135m \
            --outfile artifacts/crazeai-135m-f16.gguf \
            --outtype f16

      - name: Quantize CrazeAI to Q4_K_M
        run: |
          llama.cpp/build/bin/llama-quantize \
            artifacts/crazeai-135m-f16.gguf \
            artifacts/crazeai-135m-q4_k_m.gguf \
            Q4_K_M
          cp training_v2/crazeai-system-prompt.txt artifacts/
          ls -lh artifacts/crazeai-135m-q4_k_m.gguf

      - name: Validate GGUF
        run: |
          llama.cpp/build/bin/llama-cli \
            -m artifacts/crazeai-135m-q4_k_m.gguf \
            -p "Who are you?" \
            -n 48 \
            --temp 0.2 \
            --no-display-prompt | tee artifacts/smoke-test.txt

      - name: Upload CrazeAI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-135m-jax-q4-k-m
          path: |
            artifacts/crazeai-135m-q4_k_m.gguf
            artifacts/crazeai-135m/config.json
            artifacts/crazeai-135m/model.safetensors
            artifacts/crazeai-135m/tokenizer.json
            artifacts/smoke-test.txt
          retention-days: 30
