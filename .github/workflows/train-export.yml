name: Train and Export CrazeAI

on:
  workflow_dispatch:

jobs:
  train-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train CrazeAI
        run: python train.py

      - name: Export native model
        run: python export.py --checkpoint crazeai.pt --output crazeai.craze

      - name: Show model size
        run: ls -lh crazeai.pt crazeai.craze

      - name: Upload native model
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-native-model
          path: crazeai.craze
          retention-days: 7

      - name: Upload PyTorch checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-pytorch-checkpoint
          path: crazeai.pt
          retention-days: 7
