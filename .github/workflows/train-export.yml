name: CrazeAI Train, Resume and Export
on:
  workflow_dispatch:
    inputs:
      source:
        description: Dataset source
        type: choice
        options: [auto, local, hf]
        default: auto
        required: true
      training_mode:
        description: LoRA is recommended; full trains every parameter
        type: choice
        options: [lora, full]
        default: lora
        required: true
      max_length:
        description: Sequence length
        type: choice
        options: ["512", "1024", "1536", "2048"]
        default: "512"
        required: true
      max_steps:
        description: Maximum optimizer steps; 0 means epoch-based
        type: number
        default: 1200
        required: true
      epochs:
        description: Epochs when max_steps is 0
        type: number
        default: 1
        required: true
      batch_size:
        description: Per-device batch size (lower it if you hit CUDA out-of-memory)
        type: number
        default: 4
        required: true
      gradient_accumulation:
        description: Gradient accumulation steps
        type: number
        default: 4
        required: true
      resume:
        description: Resume from the newest available checkpoint
        type: boolean
        default: true
        required: true
      merge_lora:
        description: Merge LoRA adapters into standalone model for export
        type: boolean
        default: true
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: crazeai-model-training
  cancel-in-progress: false
jobs:
  train:
    # Use a persistent self-hosted Linux CUDA runner. A GitHub-hosted runner
    # does not provide a suitable persistent GPU/long-running training environment.
    # 7200 minutes (5 days) is the maximum GitHub allows for self-hosted jobs.
    # If a run is still cut off, use the "CrazeAI Export Model" workflow to export
    # from the uploaded training-state artifact.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 7200
    env:
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Set Hugging Face cache location
        shell: bash
        run: echo "HF_HOME=$RUNNER_TEMP/huggingface" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "huggingface_hub[cli]"
      - name: Validate GPU
        run: |
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__, "CUDA:", torch.version.cuda)
          if not torch.cuda.is_available():
              raise SystemExit("A working CUDA-enabled PyTorch install is required.")
          for i in range(torch.cuda.device_count()):
              p = torch.cuda.get_device_properties(i)
              print(i, p.name, round(p.total_memory / 2**30, 2), "GiB")
          PY
      - name: Restore previous training state
        uses: actions/download-artifact@v4
        with:
          pattern: crazeai-training-state-*
          # The artifact stores paths relative to the workspace (outputs/... and
          # data/processed/...), so restore at the workspace root. Restoring into
          # "outputs" would nest them as outputs/outputs/... and resume would never
          # find the checkpoints.
          path: .
          merge-multiple: true
        continue-on-error: true
      - name: Prepare dataset
        run: |
          if [ ! -f data/processed/train.jsonl ] || [ ! -f data/processed/validation.jsonl ]; then
            python scripts/prepare_dataset.py --count 50000 --source "${{ inputs.source }}"
          else
            echo "Reusing restored, prepared dataset."
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/processed/manifest.json")
          if not p.exists():
              raise SystemExit("Dataset manifest missing")
          m=json.loads(p.read_text())
          if m.get("unique_examples") != 50000:
              raise SystemExit(f"Expected 50,000 unique examples, got {m.get('unique_examples')}")
          print(json.dumps(m, indent=2))
          PY
      - name: Find latest checkpoint
        id: checkpoint
        shell: bash
        run: |
          latest=""
          if [ "${{ inputs.resume }}" = "true" ] && [ -d outputs/crazeai-500m ]; then
            latest="$(find outputs/crazeai-500m -maxdepth 1 -type d -name 'checkpoint-*' -printf '%f\n' | sort -V | tail -n 1)"
          fi
          if [ -n "$latest" ]; then
            echo "path=outputs/crazeai-500m/$latest" >> "$GITHUB_OUTPUT"
            echo "Resuming from $latest"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Starting a fresh run"
          fi
      - name: Train and resume automatically
        shell: bash
        run: |
          EXTRA=()
          if [ "${{ inputs.training_mode }}" = "full" ]; then EXTRA+=(--full-finetune); fi
          if [ -n "${{ steps.checkpoint.outputs.path }}" ]; then EXTRA+=(--resume-from-checkpoint "${{ steps.checkpoint.outputs.path }}"); fi
          STEPS="${{ inputs.max_steps }}"
          if [ "$STEPS" = "0" ]; then STEPS="-1"; fi
          python -m scripts.train \
            --train data/processed/train.jsonl \
            --validation data/processed/validation.jsonl \
            --output outputs/crazeai-500m \
            --epochs "${{ inputs.epochs }}" \
            --max-steps "$STEPS" \
            --max-length "${{ inputs.max_length }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --gradient-accumulation "${{ inputs.gradient_accumulation }}" \
            --save-total-limit 3 \
            "${EXTRA[@]}"
      - name: Evaluate checkpoint
        run: |
          python scripts/evaluate.py \
            --model outputs/crazeai-500m \
            --validation data/processed/validation.jsonl \
            --output outputs/crazeai-500m/evaluation.json \
            --max-length "${{ inputs.max_length }}"
      - name: Export standalone model
        if: ${{ inputs.training_mode == 'full' || inputs.merge_lora }}
        run: |
          python scripts/export_model.py \
            --model outputs/crazeai-500m \
            --output outputs/crazeai-500m-export \
            --merge-adapter
      - name: Upload resumable state even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-training-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/crazeai-500m/
            data/processed/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload exported model
        if: success() && (inputs.training_mode == 'full' || inputs.merge_lora)
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-500m-standalone-export
          path: outputs/crazeai-500m-export/
          if-no-files-found: error
          retention-days: 30
