name: Train, Export and Build CrazeAI

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  train-export-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images/* || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/dotnet || true
          sudo apt-get clean
          rm -rf ~/.cache/pip ~/.cache/torch ~/.gradle/caches
          df -h

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Train CrazeAI
        run: python train.py

      - name: Export native model
        run: python export.py --checkpoint crazeai.pt --output crazeai.craze

      - name: Verify exported model
        run: |
          ls -lh crazeai.craze
          test -s crazeai.craze

      - name: Remove large training checkpoint
        run: |
          rm -f crazeai.pt
          rm -rf ~/.cache/pip ~/.cache/torch
          df -h

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build CrazeAI Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace --no-build-cache assembleDebug

      - name: Collect release files
        run: |
          mkdir -p output
          cp crazeai.craze output/
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/CrazeAI-debug.apk \;
          ls -lh output/

      - name: Upload CrazeAI package
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-package
          path: output/
          retention-days: 7
