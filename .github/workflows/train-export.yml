name: CrazeAI Model - Train and Export

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "train.py"
      - "model.py"
      - "dataset.py"
      - "tokenizer.py"
      - "data.json"
      - "config.json"
      - "export.py"
      - "requirements.txt"
      - ".github/workflows/train-export.yml"

jobs:
  train-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo apt-get clean

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Train
        run: python train.py

      - name: Export
        run: python export.py --checkpoint crazeai.pt --output crazeai.craze

      - name: Verify
        run: |
          ls -lh crazeai.pt crazeai.craze
          test -s crazeai.craze

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-model
          path: crazeai.craze
          retention-days: 7
