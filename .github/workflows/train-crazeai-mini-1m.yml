name: Train CrazeAI Mini 1M -> GGUF Q4

on:
  push:
    branches: [test]
    paths:
      - "training_jax_1m/**"
      - "training_v2/prepare_sft.py"
      - ".github/workflows/train-crazeai-mini-1m.yml"
  workflow_dispatch:
    inputs:
      max_examples:
        description: "Maximum SmolTalk examples (plus CrazeAI seed examples)"
        required: false
        default: "10000"
        type: string
      epochs:
        description: "Training epochs"
        required: false
        default: "1"
        type: string
      seq_len:
        description: "Sequence length"
        required: false
        default: "128"
        type: string
      batch_size:
        description: "CPU batch size"
        required: false
        default: "8"
        type: string
      chunk_size:
        description: "Steps per compiled JAX chunk"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

concurrency:
  group: crazeai-mini-1m-${{ github.ref }}
  cancel-in-progress: false

env:
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: "false"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  XLA_FLAGS: "--xla_cpu_multi_thread_eigen=true intra_op_parallelism_threads=4"

jobs:
  train-and-quantize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout CrazeAI
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training_jax/requirements.txt

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training_jax/requirements.txt
          python -m pip install cmake ninja

      - name: Verify runtime and source syntax
        run: |
          python - <<'PY'
          import jax, sys
          print("Python:", sys.version)
          print("JAX:", jax.__version__)
          print("Backend:", jax.default_backend())
          print("Devices:", jax.devices())
          assert jax.default_backend() == "cpu", "This GitHub-hosted workflow expects CPU JAX"
          PY
          python -m compileall -q training_jax_1m training_v2/prepare_sft.py

      - name: Prepare bounded streaming dataset
        env:
          MAX_EXAMPLES: ${{ inputs.max_examples || '10000' }}
        run: |
          mkdir -p artifacts
          python training_v2/prepare_sft.py \
            --max-examples "$MAX_EXAMPLES" \
            --output artifacts/sft.jsonl
          test -s artifacts/sft.jsonl
          wc -l artifacts/sft.jsonl

      - name: Train CrazeAI Mini from scratch
        env:
          EPOCHS: ${{ inputs.epochs || '1' }}
          SEQ_LEN: ${{ inputs.seq_len || '128' }}
          BATCH_SIZE: ${{ inputs.batch_size || '8' }}
          CHUNK_SIZE: ${{ inputs.chunk_size || '8' }}
          MAX_EXAMPLES: ${{ inputs.max_examples || '10000' }}
        run: |
          python training_jax_1m/train.py \
            --data artifacts/sft.jsonl \
            --output artifacts/crazeai-1m-jax \
            --epochs "$EPOCHS" \
            --seq-len "$SEQ_LEN" \
            --batch-size "$BATCH_SIZE" \
            --max-examples "$MAX_EXAMPLES" \
            --chunk-size "$CHUNK_SIZE"
          test -s artifacts/crazeai-1m-jax/params.npz
          test -s artifacts/crazeai-1m-jax/tokenizer.json

      - name: Export and validate Hugging Face checkpoint
        run: |
          python training_jax_1m/export_hf.py \
            --checkpoint artifacts/crazeai-1m-jax \
            --output artifacts/crazeai-1m
          test -s artifacts/crazeai-1m/model.safetensors
          test -s artifacts/crazeai-1m/config.json
          test -s artifacts/crazeai-1m/tokenizer.json

      - name: Build llama.cpp tools
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

          # CrazeAI uses a custom ByteLevel BPE tokenizer. llama.cpp's converter
          # only recognizes a fixed list of known tokenizer hashes, so explicitly
          # map this compatible ByteLevel tokenizer to the GPT-2 pre-tokenizer.
          python - <<'PY'
          from pathlib import Path

          path = Path("llama.cpp/conversion/base.py")
          source = path.read_text(encoding="utf-8")
          marker = '        if res is None:\n            logger.warning("\\n")'
          fallback = '''        if res is None:
                  try:
                      backend = getattr(tokenizer, "backend_tokenizer", None)
                      tokenizer_json = json.loads(backend.to_str()) if backend is not None else {}
                      pre_tokenizer = tokenizer_json.get("pre_tokenizer", {})
                      if isinstance(pre_tokenizer, dict) and pre_tokenizer.get("type") == "ByteLevel":
                          res = "gpt-2"
                          logger.warning("Using GPT-2 ByteLevel pre-tokenizer compatibility for CrazeAI custom BPE tokenizer")
                  except Exception as exc:
                      logger.debug("Could not inspect custom tokenizer pre-tokenizer: %s", exc)
          '''
          if marker not in source:
              raise SystemExit("Could not locate llama.cpp tokenizer fallback marker; refusing to patch an unknown converter version")
          if "Using GPT-2 ByteLevel pre-tokenizer compatibility for CrazeAI custom BPE tokenizer" not in source:
              path.write_text(source.replace(marker, fallback + marker, 1), encoding="utf-8")
          print("Patched llama.cpp custom ByteLevel BPE tokenizer compatibility")
          PY

          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF
          cmake --build llama.cpp/build --config Release -j2 --target llama-quantize llama-cli

          # Keep converter dependencies separate from JAX/dataset dependencies.
          # llama.cpp's current converter expects transformers with Hub < 1.0.
          python -m venv /tmp/crazeai-gguf-env
          /tmp/crazeai-gguf-env/bin/python -m pip install --upgrade pip
          /tmp/crazeai-gguf-env/bin/python -m pip install -r llama.cpp/requirements.txt
          /tmp/crazeai-gguf-env/bin/python -m pip install "huggingface-hub>=0.34,<1.0"
          /tmp/crazeai-gguf-env/bin/python -c "import transformers, huggingface_hub; print('Transformers:', transformers.__version__); print('Hub:', huggingface_hub.__version__); assert int(huggingface_hub.__version__.split('.')[0]) == 0"

      - name: Convert to F16 GGUF and quantize
        run: |
          /tmp/crazeai-gguf-env/bin/python llama.cpp/convert_hf_to_gguf.py \
            artifacts/crazeai-1m \
            --outfile artifacts/crazeai-1m-f16.gguf \
            --outtype f16
          test -s artifacts/crazeai-1m-f16.gguf
          llama.cpp/build/bin/llama-quantize \
            artifacts/crazeai-1m-f16.gguf \
            artifacts/crazeai-1m-q4_k_m.gguf \
            Q4_K_M
          test -s artifacts/crazeai-1m-q4_k_m.gguf
          python - <<'PY'
          from pathlib import Path
          p = Path("artifacts/crazeai-1m-q4_k_m.gguf")
          size = p.stat().st_size
          print(f"GGUF size: {size:,} bytes ({size / 1_000_000:.2f} MB)")
          if size > 100_000_000:
              raise SystemExit("GGUF exceeds the strict 100 MB limit")
          PY

      - name: Smoke test generated GGUF
        run: |
          llama.cpp/build/bin/llama-cli \
            -m artifacts/crazeai-1m-q4_k_m.gguf \
            -p "Who are you?" \
            -n 32 \
            --temp 0.2 \
            --no-display-prompt | tee artifacts/smoke-test.txt
          test -s artifacts/smoke-test.txt

      - name: Upload model and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazeai-mini-1m-q4-k-m
          path: |
            artifacts/crazeai-1m-q4_k_m.gguf
            artifacts/crazeai-1m/config.json
            artifacts/crazeai-1m/model.safetensors
            artifacts/crazeai-1m/tokenizer.json
            artifacts/smoke-test.txt
          if-no-files-found: warn
          retention-days: 14
