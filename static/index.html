<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrazeAI — Daily AI</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#f2f2f2;font:15px system-ui,-apple-system,sans-serif}main{width:min(900px,94vw);margin:auto;padding:22px 0 40px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:24px;margin:0}.badge{font-size:12px;color:#aaa;border:1px solid #292929;padding:6px 9px;border-radius:999px}.chat{min-height:55vh;background:#0d0d0d;border:1px solid #222;border-radius:18px;padding:14px;overflow:auto}.msg{max-width:82%;padding:11px 13px;border-radius:14px;margin:9px 0;white-space:pre-wrap;line-height:1.5}.user{margin-left:auto;background:#e9e9e9;color:#080808}.ai{background:#151515;border:1px solid #252525}.thinking{color:#888;font-style:italic}.composer{position:sticky;bottom:10px;margin-top:12px;background:#0d0d0d;border:1px solid #292929;border-radius:16px;padding:10px}textarea{width:100%;resize:none;background:#080808;color:#eee;border:0;outline:0;border-radius:10px;padding:10px;min-height:54px;font:inherit}.row{display:flex;align-items:center;gap:10px;margin-top:7px}button{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.ask{margin-left:auto;background:#eee;color:#000}.toggle{color:#aaa;font-size:13px}.sources{font-size:12px;margin:4px 0 12px 8px}.sources a{display:block;color:#aaa;margin:5px 0;text-decoration:none}.welcome{color:#888;text-align:center;padding:24px}@media(max-width:600px){.msg{max-width:92%}}</style></head><body><main><header><h1>CrazeAI</h1><span class="badge">Daily AI</span></header><div id="chat" class="chat"><div class="welcome">Ask anything. CrazeAI can route fresh questions to web search.</div></div><div class="composer"><textarea id="p" placeholder="Message CrazeAI..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><div class="row"><label class="toggle"><input id="s" type="checkbox" checked> Web when needed</label><button class="ask" onclick="send()">Ask</button></div></div></main><script>
const chat=document.getElementById('chat'),input=document.getElementById('p');
function add(text,kind,cls=''){const d=document.createElement('div');d.className='msg '+kind+' '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function send(){const p=input.value.trim();if(!p)return;if(chat.querySelector('.welcome'))chat.innerHTML='';add(p,'user');input.value='';input.focus();const t=add('Thinking…','ai','thinking');try{const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,search:document.getElementById('s').checked,max_new_tokens:64,temperature:.7,top_k:30})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');t.classList.remove('thinking');t.textContent='';const text=d.response||'No response.';const lines=text.split(/(?<=[.!?])\s+|\n+/);for(const line of lines){if(!line.trim())continue;t.textContent+=(t.textContent?'\n':'')+line.trim();chat.scrollTop=chat.scrollHeight;await new Promise(x=>setTimeout(x,35))}if(d.sources?.length){const box=document.createElement('div');box.className='sources';d.sources.forEach(x=>{if(x.url){const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent='↗ '+(x.title||x.url);box.appendChild(a)}});chat.appendChild(box)}}catch(e){t.classList.remove('thinking');t.textContent='Error: '+e.message}}
</script></body></html>
