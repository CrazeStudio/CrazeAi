<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrazeAI</title><style>body{margin:0;background:#080808;color:#eee;font:15px system-ui;display:flex;justify-content:center}main{width:min(900px,94vw);padding:24px}.box{background:#111;border:1px solid #242424;border-radius:18px;padding:18px}textarea{width:100%;box-sizing:border-box;background:#090909;color:#eee;border:1px solid #333;border-radius:12px;padding:14px;min-height:110px}button{margin-top:10px;padding:12px 18px;border:0;border-radius:10px;background:#eee;color:#000;font-weight:700}.answer{white-space:pre-wrap;line-height:1.55;margin-top:18px}.sources{margin-top:14px;font-size:13px}.sources a{color:#aaa;display:block;margin:7px 0}</style></head><body><main><h1>CrazeAI</h1><p>1.35M GPT + analyzer + web search</p><div class="box"><textarea id="p" placeholder="Ask CrazeAI..."></textarea><label><input id="s" type="checkbox" checked> Search when needed</label><br><button onclick="send()">Ask</button><div id="a" class="answer"></div><div id="src" class="sources"></div></div></main><script>async function send(){const p=document.getElementById('p').value.trim(),a=document.getElementById('a'),s=document.getElementById('src');if(!p)return;a.textContent='Thinking...';s.innerHTML='';try{const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,search:document.getElementById('s').checked})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');a.textContent=d.response||'';(d.sources||[]).forEach(x=>{if(x.url){const e=document.createElement('a');e.href=x.url;e.target='_blank';e.textContent='↗ '+x.title;s.appendChild(e)}})}catch(e){a.textContent='Error: '+e.message}}</script></body></html>
