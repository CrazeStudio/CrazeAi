<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrazeAI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font:15px system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(900px,100%);padding:24px;display:flex;flex-direction:column;min-height:100vh}h1{margin:0 0 8px;font-size:28px}.sub{color:#888;margin-bottom:24px}.chat{flex:1;border:1px solid #242424;border-radius:16px;padding:18px;min-height:400px;white-space:pre-wrap;overflow:auto;background:#0d0d0d}.input{display:flex;gap:10px;margin-top:14px}textarea{flex:1;resize:none;background:#151515;color:#fff;border:1px solid #2b2b2b;border-radius:12px;padding:13px;min-height:52px;font:inherit}button{border:0;border-radius:12px;padding:0 20px;background:#eee;color:#080808;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.settings{display:flex;gap:10px;margin-top:10px}.settings input{width:100px;background:#151515;color:#fff;border:1px solid #2b2b2b;border-radius:8px;padding:8px}.msg{margin-bottom:18px}.role{font-size:12px;color:#777;margin-bottom:5px;text-transform:uppercase}
</style></head>
<body><main class="app"><h1>CrazeAI</h1><div class="sub">Local PyTorch Transformer</div><section id="chat" class="chat"></section><div class="input"><textarea id="prompt" placeholder="Type a prompt..."></textarea><button id="send">Send</button></div><div class="settings"><label>Tokens <input id="tokens" type="number" value="100" min="1" max="512"></label><label>Temp <input id="temp" type="number" value="0.8" min="0.01" max="2" step="0.05"></label></div></main>
<script>
const chat=document.querySelector('#chat'),prompt=document.querySelector('#prompt'),send=document.querySelector('#send');
function add(role,text){const d=document.createElement('div');d.className='msg';d.innerHTML='<div class="role">'+role+'</div>';const p=document.createElement('div');p.textContent=text;d.appendChild(p);chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function run(){const text=prompt.value.trim();if(!text)return;prompt.value='';send.disabled=true;add('You',text);add('CrazeAI','Thinking...');const thinking=chat.lastChild;try{const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text,max_new_tokens:+document.querySelector('#tokens').value,temperature:+document.querySelector('#temp').value,top_k:50})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');thinking.querySelector('div:last-child').textContent=data.response}catch(e){thinking.querySelector('div:last-child').textContent='Error: '+e.message}finally{send.disabled=false;prompt.focus()}}
send.onclick=run;prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}});
</script></body></html>
