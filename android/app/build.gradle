plugins { id 'com.android.application' }

android {
    namespace 'ai.craze.runtime'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.craze.runtime'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        externalNativeBuild { cmake { cppFlags '-O3 -ffast-math' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
}
