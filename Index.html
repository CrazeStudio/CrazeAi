<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CrazeAi Web</title>
</head>
<body>
  <h2>CrazeAi</h2>
  <input id="msg" placeholder="Ask anything..." style="width:70%;">
  <button onclick="send()">Ask</button>

  <pre id="answer"></pre>
  <ul id="links"></ul>

<script>
const API_URL = "https://YOUR-RENDER-URL/api/crazeai"; 
// for local dev: "http://localhost:8000/api/crazeai"

async function send() {
    const msg = document.getElementById("msg").value;
    document.getElementById("answer").innerText = "Thinking...";
    document.getElementById("links").innerHTML = "";

    const res = await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    });

    const data = await res.json();

    document.getElementById("answer").innerText = data.answer;

    data.results.forEach(r => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="${r.url}" target="_blank">${r.title}</a> <small>[${r.source}]</small>`;
        document.getElementById("links").appendChild(li);
    });
}
</script>
</body>
</html>
